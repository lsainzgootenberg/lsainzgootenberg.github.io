<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finders-Keepers Radio — Léa Sainz-Gootenberg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f6f7f8;
    --text:#161c22;
    --muted:#5c6770;
    --accent:#b5761a;
    --rule:#e2e5e9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--text);}
  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:0 24px;
  }
  header{
    padding:28px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--rule);
  }
  .mark{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:2rem;
    letter-spacing:0.01em;
    text-decoration:none;
    color:var(--text);
  }
  nav a{
    color:var(--muted);
    text-decoration:none;
    font-size:0.92rem;
  }
  nav a:hover{color:var(--accent);}

  .back-link{
    display:inline-block;
    margin:32px 0 0;
    color:var(--muted);
    text-decoration:none;
    font-size:0.9rem;
  }
  .back-link:hover{color:var(--accent);}

  .cover{
    margin-top:24px;
    border-radius:6px;
    overflow:hidden;
  }
  .cover img{
    width:100%;
    display:block;
  }

  h1.title{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:clamp(2rem,5vw,2.8rem);
    margin-top:32px;
  }
  .role-line{
    color:var(--accent);
    font-size:0.95rem;
    margin-top:8px;
  }

  .video-link{
    display:block;
    margin-top:36px;
    position:relative;
    aspect-ratio:16/9;
    border-radius:6px;
    overflow:hidden;
    background:#12181f;
    text-decoration:none;
  }
  .video-link img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0.85;
  }
  .play-button{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:64px;
    height:64px;
    border-radius:50%;
    background:rgba(255,255,255,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .play-button::after{
    content:'';
    border-style:solid;
    border-width:11px 0 11px 18px;
    border-color:transparent transparent transparent #161c22;
    margin-left:4px;
  }
  .video-caption{
    margin-top:10px;
    font-size:0.85rem;
    color:var(--muted);
  }

  .description{
    margin-top:40px;
    padding-top:32px;
    border-top:1px solid var(--rule);
  }
  .description p{
    max-width:60ch;
    color:var(--muted);
    margin-bottom:16px;
  }
  .description p:last-child{margin-bottom:0;}
  .placeholder-note{
    font-style:italic;
    color:#a8b0b6;
  }

  footer{
    padding:48px 0 48px;
    color:var(--muted);
    font-size:0.82rem;
    margin-top:40px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="mark" href="index.html">Léa Sainz-Gootenberg</a>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <a class="back-link" href="index.html">&larr; Back to all projects</a>

  <div class="cover">
    <img src="images/fkcover.jpg" alt="Finders-Keepers Radio collage cover art">
  </div>

  <h1 class="title">Finders-Keepers Radio</h1>
  <div class="role-line">DJ / Radio Producer · 2022–2026</div>

  <a class="video-link" href="https://www.youtube.com/@FindersKeepersRadio/videos" target="_blank" rel="noopener">
    <img src="images/fkcover.jpg" alt="Finders-Keepers Radio on YouTube — click to watch">
    <div class="play-button"></div>
  </a>
  <div class="video-caption">Watch on YouTube &rarr;</div>

  <div class="description">
    <p class="placeholder-note">[Add your project description here — what Finders-Keepers is, how it started, what a typical episode looks like, and anything you're proud of from producing it.]</p>
  </div>

  <footer>
    Chicago, IL
  </footer>

</div>
</body>
</html>
